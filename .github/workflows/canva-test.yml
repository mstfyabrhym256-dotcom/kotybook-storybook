
name: Canva Login Diagnostic

on:
  workflow_dispatch:

jobs:
  test-canva:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Diagnose Canva access
        env:
          CANVA_AUTH_STATE_JSON: ${{ secrets.CANVA_AUTH_STATE_JSON }}
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');

          (async () => {
            let browser;

            try {
              const raw = process.env.CANVA_AUTH_STATE_JSON;

              if (!raw) {
                throw new Error('CANVA_AUTH_STATE_JSON secret is missing');
              }

              const state = JSON.parse(raw);

              if (!Array.isArray(state.cookies) ||
                  !Array.isArray(state.origins)) {
                throw new Error('Canva session data has an invalid format');
              }

              console.log('Session data loaded.');
              console.log('Cookies count:', state.cookies.length);
              console.log('Origins count:', state.origins.length);

              browser = await chromium.launch({
                headless: true,
                args: ['--disable-blink-features=AutomationControlled']
              });

              const context = await browser.newContext({
                storageState: state,
                viewport: { width: 1365, height: 900 },
                locale: 'en-US'
              });

              const page = await context.newPage();

              page.on('console', msg => {
                if (msg.type() === 'error') {
                  console.log('Browser console error:', msg.text().slice(0, 300));
                }
              });

              page.on('requestfailed', request => {
                console.log(
                  'Request failed:',
                  request.url().slice(0, 200),
                  request.failure()?.errorText
                );
              });

              console.log('Opening Canva AI...');

              const response = await page.goto('https://www.canva.com/ai/', {
                waitUntil: 'domcontentloaded',
                timeout: 90000
              });

              console.log('HTTP status:', response?.status() ?? 'No response');
              console.log('Current URL:', page.url());

              await page.waitForTimeout(15000);

              console.log('Final URL:', page.url());
              console.log('Page title:', await page.title());

              const bodyText = await page.locator('body').innerText()
                .catch(() => 'Could not read page text');

              console.log('Page text:');
              console.log(bodyText.slice(0, 2500));

              const textareaCount = await page.locator('textarea:visible').count();
              const inputCount = await page.locator('input:visible').count();

              console.log('Visible textareas:', textareaCount);
              console.log('Visible inputs:', inputCount);

              if (/just a moment|checking your browser|verify you are human/i.test(bodyText)) {
                console.log('RESULT: Canva security challenge detected.');
              } else if (/login|signup|sign-in/i.test(page.url())) {
                console.log('RESULT: Canva redirected to login.');
              } else if (textareaCount > 0) {
                console.log('RESULT: A text editor may be available.');
              } else {
                console.log('RESULT: Canva opened, but the AI editor was not detected.');
              }

            } catch (error) {
              console.error('DIAGNOSTIC ERROR:', error.message);
              process.exitCode = 1;
            } finally {
              if (browser) await browser.close();
            }
          })();
          NODE
