name: Kotybook Storybook Generator

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Kotybook order code'
        required: true
        type: string

jobs:
  generate-story:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Google Chrome and system dependencies
        run: npx playwright install --with-deps chrome

      - name: Generate story and upload PDF
        env:
          ORDER_CODE: ${{ inputs.code }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AUTH_STATE_JSON: ${{ secrets.AUTH_STATE_JSON }}
          REATTACH_EACH: '1'
        run: node worker.js
