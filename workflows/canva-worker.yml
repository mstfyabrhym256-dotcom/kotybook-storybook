name: Kotybook Canva Worker

on:
  workflow_dispatch:
    inputs:
      story_prompt:
        description: "النص الكامل للقصة المطلوب تنفيذها في Canva AI"
        required: true
        type: string

permissions:
  contents: read

jobs:
  canva-worker:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Run Canva worker
        env:
          CANVA_AUTH_STATE_JSON: ${{ secrets.CANVA_AUTH_STATE_JSON }}
          STORY_PROMPT: ${{ inputs.story_prompt }}
          OUTPUT_DIR: canva-worker/output
        run: node canva-worker/worker.js

      - name: Upload downloaded PDF and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotybook-canva-worker-output
          path: |
            canva-worker/output/
            canva-worker/diagnostics/
          if-no-files-found: warn
          retention-days: 7
